name: Cleanup old Actions runs

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the latest two completed runs per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          runs_to_delete="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed") | [.workflow_id, .id, .created_at] | @tsv' \
              | sort -t $'\\t' -k1,1n -k3,3r -k2,2nr \
              | awk -F '\\t' -v current="${CURRENT_RUN_ID}" '
                  $2 == current { next }
                  {
                    count[$1]++
                    if (count[$1] > 2) print $2
                  }
                '
          )"

          if [[ -z "${runs_to_delete}" ]]; then
            echo "Nothing to delete."
            exit 0
          fi

          while IFS= read -r run_id; do
            [[ -z "${run_id}" ]] && continue
            echo "Deleting completed workflow run ${run_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done <<< "${runs_to_delete}"
